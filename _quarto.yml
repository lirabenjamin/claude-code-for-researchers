project:
  type: website
  output-dir: _site.nosync
  render:
    - "index.qmd"
    - "demo_script.md"
    - "TEMPLATE_CLAUDE.md"
    - "skills/index.qmd"

  resources:
    - "skills/*/SKILL.md"
    - "assets/"
    - "robots.txt"

  post-render:
    - scripts/exclude-from-sitemap.py

website:
  title: "Claude Code for Researchers"
  description: "Slides, a runbook, a CLAUDE.md template, and 18 installable skills for using Claude Code in research work."
  site-url: "https://lirabenjamin.github.io/claude-code-for-researchers"
  repo-url: "https://github.com/lirabenjamin/claude-code-for-researchers"
  repo-actions: [source]
  favicon: assets/favicon.png
  navbar:
    logo: assets/mascot.png
    left:
      - text: Home
        href: index.qmd
      - text: Slides
        href: https://docs.google.com/presentation/d/1j67OxP7MQudUdp6t-OtCPzaASTS8nBktCXalzXrvC1g/present
      - text: Skills
        href: skills/index.qmd
      - text: CLAUDE.md Template
        href: TEMPLATE_CLAUDE.md
    right:
      - icon: github
        href: https://github.com/lirabenjamin/claude-code-for-researchers
        aria-label: GitHub

format:
  html:
    theme: [cosmo, theme.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    anchor-sections: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400&display=swap">
